[workspace]
resolver = "2"
members = [
  "crates/credential-store",
  "crates/local-proxy",
  "crates/platform-launcher",
  "crates/switcher-core",
  "src-tauri",
]

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
directories = "6"
fs4 = "1.1"
futures-util = "0.3"
keyring = "4.1.5"
keyring-core = "1.0.0"
rand = "0.10"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
toml_edit = "0.25.13"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.62.2" }
windows-native-keyring-store = "1.1.0"
zeroize = "1"
